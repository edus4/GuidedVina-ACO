name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate examples
        run: python scripts/make_examples.py
      - name: Run tests
        run: python -m pytest -q
      - name: Dry run smoke test
        run: |
          python -m guidedvina.cli \
            --receptor examples/sample_receptor.pdbqt \
            --ligand examples/sample_ligand.pdbqt \
            --center 0 0 0 --critical-residues A:12 A:60 A:61 --dry-run > /dev/null
